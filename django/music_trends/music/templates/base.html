{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Music Trends{% endblock %}</title>
  <script>
    // Apply the saved theme before paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'music/style.css' %}" />
</head>
<body>
  <nav>
    <a href="{% url 'home' %}" class="nav-brand">♪ Music Trends</a>
    <ul class="nav-links">
      <li>
        <a href="{% url 'home' %}"
           {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>
          Dashboard
        </a>
      </li>
      <li>
        <a href="{% url 'songs' %}"
           {% if request.resolver_match.url_name == 'songs' or request.resolver_match.url_name == 'song_detail' %}class="active"{% endif %}>
          Songs
        </a>
      </li>
      <li>
        <a href="{% url 'insights' %}"
           {% if request.resolver_match.url_name == 'insights' %}class="active"{% endif %}>
          Insights
        </a>
      </li>
      <li>
        <a href="{% url 'billboard' %}"
           {% if request.resolver_match.url_name == 'billboard' %}class="active"{% endif %}>
          Billboard
        </a>
      </li>
      <li>
        <a href="{% url 'operations' %}"
           {% if request.resolver_match.url_name == 'operations' %}class="active"{% endif %}>
          Operations
        </a>
      </li>
      <li>
        <a href="{% url 'about_data' %}"
           {% if request.resolver_match.url_name == 'about_data' %}class="active"{% endif %}>
          About Data
        </a>
      </li>
    </ul>
    <button type="button" class="theme-toggle" aria-label="Toggle dark / light mode" title="Toggle dark / light mode">
      <span class="theme-icon" aria-hidden="true">☀️</span>
    </button>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <script>
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      var icon = btn.querySelector('.theme-icon');
      function current() {
        return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      }
      function apply(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        if (icon) icon.textContent = theme === 'light' ? '🌙' : '☀️';
        try { localStorage.setItem('theme', theme); } catch (e) {}
      }
      apply(current());
      btn.addEventListener('click', function () {
        apply(current() === 'light' ? 'dark' : 'light');
      });
    })();
  </script>
</body>
</html>
